[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-segmentation-service"
version = "0.1.0"
description = "Service for bank customer segmentation and risk assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas >=2.0.0",
    "numpy >=1.24.0",
    "scikit-learn >=1.3.0",
    "fastapi >=0.115.0",       # Обновленная версия FastAPI
    "uvicorn[standard] >=0.30.0", # Обновленная версия Uvicorn
    "pydantic >=2.0.0",
    "pyyaml >=6.0",
    "prometheus-client >=0.17.0",
    "typer >=0.9.0",
    "joblib >=1.3.0",
    "python-dotenv >=1.0.0",
    "pytest >=7.0.0",
    "pytest-cov >=4.0.0",
    "httpx2 >=0.1.0",
]

[project.scripts]
bank-cli = "bank_segmentation.cli:app"
